<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Work</title>
    
    <!-- Telegram Script (সবার আগে) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- React & Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Loading Animation */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Supabase Config
        const supabase = window.supabase.createClient('https://jmnndvfepbuomprtwdsl.supabase.co', 'sb_publishable_rYvGNp6Hve-pEgOKwBXCZA_CPq_4_W9');

        // --- 1. Loading Screen (Old Blue Design) ---
        const LoadingScreen = () => (
            <div className="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
                <div className="loader mb-4"></div>
                <p className="text-gray-500 font-medium animate-pulse">Checking User Data...</p>
            </div>
        );

        // --- 2. Dashboard Component (Original Design) ---
        const Dashboard = ({ user, services, appSettings, onServiceClick, onHistoryClick }) => {
            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <div className="bg-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <i className="fa-solid fa-robot text-2xl text-blue-600"></i>
                            <span className="font-bold text-lg text-gray-800">Infinity Work</span>
                        </div>
                        <button onClick={onHistoryClick} className="text-gray-600">
                            <i className="fa-solid fa-clock-rotate-left text-xl"></i>
                        </button>
                    </div>

                    <div className="p-4 space-y-4">
                        {/* Profile Card */}
                        <div className="bg-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-full bg-blue-500 text-white flex items-center justify-center text-xl font-bold border-2 border-white shadow">
                                    {user.first_name ? user.first_name[0] : <i className="fa-solid fa-user"></i>}
                                </div>
                                <div>
                                    <h2 className="font-bold text-gray-800 text-lg">{user.first_name} {user.last_name}</h2>
                                    <p className="text-gray-500 text-sm font-medium">
                                        {user.id ? `ID: ${user.id}` : "Guest User"}
                                    </p>
                                </div>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                                <i className="fa-solid fa-moon text-gray-600"></i>
                            </div>
                        </div>

                        {/* Video Thumbnail (Blue Gradient) */}
                        <div className="relative rounded-2xl overflow-hidden h-48 bg-gradient-to-r from-blue-900 to-indigo-900 shadow-lg flex items-center justify-center">
                            {appSettings?.thumbnail_url && (
                                <img src={appSettings.thumbnail_url} className="absolute inset-0 w-full h-full object-cover opacity-60" />
                            )}
                            <div className="absolute z-10 text-right w-full pr-6 top-8">
                                <h2 className="text-white text-3xl font-bold leading-tight drop-shadow-md">
                                    কিভাবে<br/>কাজ জমা<br/>দিবেন!
                                </h2>
                            </div>
                            <a href={appSettings?.video_url || '#'} target="_blank" className="absolute z-20 bg-white/20 backdrop-blur-md border border-white p-4 rounded-full text-white shadow-lg">
                                <i className="fa-solid fa-play text-2xl ml-1"></i>
                            </a>
                        </div>

                        {/* Notice Section */}
                        <div className="bg-white rounded-xl p-4 shadow-sm border-l-4 border-red-500">
                            <div className="flex items-center gap-2 mb-1">
                                <i className="fa-solid fa-thumbtack text-red-500 rotate-45"></i>
                                <span className="font-bold text-gray-800">নোটিশ</span>
                            </div>
                            <p className="text-gray-600 text-sm">
                                {appSettings?.notice_text || "আস সালামু আলাইকুম, সঠিকভাবে কাজ জমা দিন।"}
                            </p>
                        </div>

                        {/* Services (Instagram/Facebook Buttons) */}
                        <div className="grid grid-cols-2 gap-4">
                            {services.map((service) => (
                                <div 
                                    key={service.id} 
                                    onClick={() => onServiceClick(service)}
                                    className="bg-white rounded-2xl p-6 flex flex-col items-center justify-center shadow-sm active:scale-95 transition cursor-pointer h-40"
                                >
                                    <img src={service.icon} alt={service.name} className="w-16 h-16 mb-3 object-contain" />
                                    <span className="font-bold text-gray-800">{service.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3. Form Component (Submit Page) ---
        const FormScreen = ({ service, user, onBack }) => {
            const [file, setFile] = useState(null);
            const [sheetContent, setSheetContent] = useState(null);
            const [formData, setFormData] = useState({});
            const [options, setOptions] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const fetchOpts = async () => { 
                    const { data } = await supabase.from('service_options').select('*').eq('service_id', service.id); 
                    if(data) setOptions(data); 
                };
                fetchOpts();
            }, [service]);

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleFileChange = (e) => { 
                if (e.target.files.length > 0) {
                    const f = e.target.files[0];
                    setFile(f);
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        setSheetContent(data);
                    };
                    reader.readAsBinaryString(f);
                }
            };

            const handleSubmit = async () => {
                if(!file || !sheetContent) return alert("Please upload Excel file.");
                if(!user.id) return alert("Telegram ID Not Found. Please open from Telegram.");

                setIsSubmitting(true);
                try {
                    const fileName = `${user.id}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                    const { error: upErr } = await supabase.storage.from('work_files').upload(fileName, file); 
                    if(upErr) throw upErr;
                    
                    const { data: { publicUrl } } = supabase.storage.from('work_files').getPublicUrl(fileName);
                    
                    const submissionData = { 
                        user_id: String(user.id), 
                        username: user.username || "No Username", 
                        service_name: service.name, 
                        file_name: file.name, 
                        file_url: publicUrl, 
                        form_data: { ...formData, sheet_content: sheetContent }
                    };
                    
                    const { error } = await supabase.from('submissions').insert([submissionData]); 
                    if(error) throw error;
                    
                    alert("✅ Submitted Successfully!");
                    onBack();
                } catch (e) { alert("Error: " + e.message); } 
                finally { setIsSubmitting(false); }
            };

            const getOpts = (cat) => options.filter(o => o.category_name === cat);

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    <div className="bg-white p-4 flex items-center justify-between shadow-sm sticky top-0 z-20">
                        <button onClick={onBack}><i className="fa-solid fa-arrow-left text-xl text-gray-600"></i></button>
                        <span className="font-bold text-lg text-gray-800">Infinity Submit</span>
                        <div className="w-6"></div>
                    </div>

                    <div className="p-5 space-y-5">
                        <h2 className="text-center text-xl font-bold text-blue-600">Submit {service.name}</h2>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Account Type:</label>
                                <select name="Account Type" onChange={handleChange} className="w-full border rounded-lg p-3 bg-white">
                                    <option>--Select--</option>
                                    {getOpts('Account Type').map(o => <option key={o.id}>{o.option_value}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Mail Type:</label>
                                <select name="Mail Type" onChange={handleChange} className="w-full border rounded-lg p-3 bg-white">
                                    <option>--Select--</option>
                                    {getOpts('Mail Type').map(o => <option key={o.id}>{o.option_value}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                            <div><label className="text-xs font-bold block mb-1">2FA-Cook</label><select name="2FA-Cook" onChange={handleChange} className="w-full border rounded p-2 text-sm bg-white"><option>Select</option>{getOpts('2FA-Cook').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                            <div><label className="text-xs font-bold block mb-1">Friends</label><select name="Friends" onChange={handleChange} className="w-full border rounded p-2 text-sm bg-white"><option>Select</option>{getOpts('Friends').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                            <div><label className="text-xs font-bold block mb-1">Total Id</label><input type="number" name="Total Id" onChange={handleChange} className="w-full border rounded p-2 text-sm bg-white" placeholder="0"/></div>
                        </div>

                        {/* --- LOCKED USER INFO --- */}
                        <div className="bg-gray-100 p-4 rounded-xl border border-gray-200">
                            <div className="flex justify-between mb-2">
                                <span className="text-xs font-bold text-gray-500">User ID</span>
                                <span className="text-xs font-bold text-black">{user.id || "Guest"}</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-xs font-bold text-gray-500">Username</span>
                                <span className="text-xs font-bold text-black">{user.username ? `@${user.username}` : "None"}</span>
                            </div>
                        </div>

                        <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer bg-white hover:bg-blue-50">
                            <div className="bg-green-100 text-green-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2">
                                <i className="fa-solid fa-file-excel text-xl"></i>
                            </div>
                            <p className="font-bold text-gray-700">{file ? file.name : "Click to Upload File"}</p>
                            <p className="text-xs text-gray-500">.xlsx / .xls files only</p>
                            <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".xlsx,.xls" />
                        </div>

                        <button onClick={handleSubmit} disabled={isSubmitting} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition disabled:bg-gray-400">
                            {isSubmitting ? "Submitting..." : "Submit Work"}
                        </button>
                    </div>
                </div>
            );
        };

        // --- 4. History Screen ---
        const HistoryScreen = ({ user, onBack }) => {
            const [history, setHistory] = useState([]);
            
            useEffect(() => {
                const fetchHistory = async () => {
                    if(!user.id) return;
                    const { data } = await supabase.from('submissions')
                        .select('*').eq('user_id', String(user.id))
                        .order('created_at', {ascending: false}).limit(10);
                    if(data) setHistory(data);
                };
                fetchHistory();
            }, [user]);

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-white p-4 flex items-center gap-3 shadow-sm sticky top-0">
                        <button onClick={onBack}><i className="fa-solid fa-arrow-left text-xl"></i></button>
                        <span className="font-bold text-lg">History</span>
                    </div>
                    <div className="p-4 space-y-3">
                        {history.length === 0 ? <p className="text-center text-gray-400 mt-10">No history found.</p> : 
                            history.map(h => (
                                <div key={h.id} className="bg-white p-4 rounded-xl shadow-sm border">
                                    <div className="flex justify-between">
                                        <span className="font-bold text-blue-600">{h.service_name}</span>
                                        <span className={`text-xs px-2 py-1 rounded ${h.status==='Rejected'?'bg-red-100 text-red-600':'bg-yellow-100 text-yellow-600'}`}>{h.status || 'Pending'}</span>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">{new Date(h.created_at).toLocaleDateString()}</p>
                                </div>
                            ))
                        }
                    </div>
                </div>
            );
        };

        // --- 5. Main App Controller (The Fix) ---
        const App = () => {
            const [screen, setScreen] = useState("loading");
            const [user, setUser] = useState({ id: "", first_name: "Guest", last_name: "", username: "" });
            const [services, setServices] = useState([]);
            const [appSettings, setAppSettings] = useState(null);
            const [selectedService, setSelectedService] = useState(null);

            useEffect(() => {
                // --- TELEGRAM DATA FIX (LOOP) ---
                const tgInterval = setInterval(() => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const tg = window.Telegram.WebApp;
                        tg.expand();
                        const u = tg.initDataUnsafe?.user;
                        
                        if (u && u.id) {
                            setUser({ ...u });
                            clearInterval(tgInterval); // Stop checking once found
                        }
                    }
                }, 200); // Check every 200ms

                // Stop checking after 3 seconds (Assume Guest if not found)
                setTimeout(() => clearInterval(tgInterval), 3000);

                // Fetch Supabase Data
                const fetchData = async () => {
                    const [svc, set] = await Promise.all([
                        supabase.from('services').select('*').order('id'),
                        supabase.from('settings').select('*').single()
                    ]);
                    if(svc.data) setServices(svc.data);
                    if(set.data) setAppSettings(set.data);
                    
                    // Show Dashboard after 1.5s
                    setTimeout(() => setScreen("dashboard"), 1500);
                };
                fetchData();

                return () => clearInterval(tgInterval);
            }, []);

            return (
                <>
                    {screen === "loading" && <LoadingScreen />}
                    {screen === "dashboard" && (
                        <Dashboard 
                            user={user} 
                            services={services} 
                            appSettings={appSettings} 
                            onServiceClick={(s) => { setSelectedService(s); setScreen("form"); }}
                            onHistoryClick={() => setScreen("history")}
                        />
                    )}
                    {screen === "form" && <FormScreen service={selectedService} user={user} onBack={() => setScreen("dashboard")} />}
                    {screen === "history" && <HistoryScreen user={user} onBack={() => setScreen("dashboard")} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
  </html>
