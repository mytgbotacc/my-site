<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoktoBondhu BD - Save Lives</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs (Compat version for simple CDN usage) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

    <!-- Custom Theme Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blood: {
                            DEFAULT: '#B71C1C', // Deep Red
                            light: '#D32F2F',
                            dark: '#7F0000',
                            bg: '#FFEBEE'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9FAFB; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #B71C1C; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. FIREBASE CONFIGURATION (EDIT HERE)
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyBvPb_Vy9AVYkPqecQWoDdVAMgWPY6PRto",
  authDomain: "blood-app-f5af6.firebaseapp.com",
  projectId: "blood-app-f5af6",
  storageBucket: "blood-app-f5af6.firebasestorage.app",
  messagingSenderId: "725132645304",
  appId: "1:725132645304:web:830fdc659f673b3b04754d"
};

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        // const messaging = firebase.messaging(); // Uncomment if using HTTPS and Service Worker

        // ==========================================
        // 2. CONSTANTS & UTILS
        // ==========================================
        
        const BANGLADESH_DATA = {
            "Dhaka": ["Dhaka", "Gazipur", "Kishoreganj", "Manikganj", "Munshiganj", "Narayanganj", "Narsingdi", "Tangail", "Faridpur", "Gopalganj", "Madaripur", "Rajbari", "Shariatpur"],
            "Chattogram": ["Chattogram", "Cox's Bazar", "Cumilla", "Brahmanbaria", "Chandpur", "Lakshmipur", "Noakhali", "Feni", "Khagrachhari", "Rangamati", "Bandarban"],
            "Rajshahi": ["Rajshahi", "Natore", "Naogaon", "Chapainawabganj", "Pabna", "Sirajganj", "Bogura", "Joypurhat"],
            "Khulna": ["Khulna", "Bagerhat", "Satkhira", "Jashore", "Magura", "Jhenaidah", "Narail", "Kushtia", "Chuadanga", "Meherpur"],
            "Barishal": ["Barishal", "Bhola", "Patuakhali", "Pirojpur", "Jhalokathi", "Barguna"],
            "Sylhet": ["Sylhet", "Moulvibazar", "Habiganj", "Sunamganj"],
            "Rangpur": ["Rangpur", "Gaibandha", "Nilphamari", "Kurigram", "Lalmonirhat", "Dinajpur", "Thakurgaon", "Panchagarh"],
            "Mymensingh": ["Mymensingh", "Jamalpur", "Netrokona", "Sherpur"]
        };

        const BLOOD_GROUPS = ["A+", "A-", "B+", "B-", "O+", "O-", "AB+", "AB-"];

        // Helper: Calculate Date Difference
        const getDaysDiff = (dateString) => {
            if (!dateString) return 999;
            const today = new Date();
            const last = new Date(dateString);
            const diffTime = Math.abs(today - last);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        };

        // Helper: Check Eligibility (90 Days Rule)
        const isEligible = (lastDate, isAvailable) => {
            if (!isAvailable) return false;
            if (!lastDate) return true;
            return getDaysDiff(lastDate) >= 90;
        };

        // ==========================================
        // 3. REACT COMPONENTS
        // ==========================================

        const { useState, useEffect } = React;

        // --- UI Components ---
        const Button = ({ children, onClick, variant = "primary", className = "", type="button", disabled=false }) => {
            const baseStyle = "px-6 py-2 rounded-lg font-semibold transition-all duration-200 shadow-md flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-blood text-white hover:bg-blood-dark disabled:opacity-50",
                secondary: "bg-white text-blood border border-blood hover:bg-blood-bg",
                outline: "border border-gray-300 text-gray-700 hover:bg-gray-50",
                danger: "bg-red-600 text-white hover:bg-red-700"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", value, onChange, placeholder, required = false }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">{label} {required && <span className="text-red-500">*</span>}</label>
                <input 
                    type={type} 
                    value={value} 
                    onChange={onChange} 
                    placeholder={placeholder}
                    required={required}
                    className="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blood focus:border-transparent outline-none"
                />
            </div>
        );

        const Select = ({ label, value, onChange, options, placeholder }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                <select value={value} onChange={onChange} className="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blood outline-none bg-white">
                    <option value="">{placeholder}</option>
                    {options.map((opt, idx) => (
                        <option key={idx} value={opt}>{opt}</option>
                    ))}
                </select>
            </div>
        );

        const Badge = ({ children, color = "green" }) => (
            <span className={`px-2 py-1 text-xs font-bold rounded-full bg-${color}-100 text-${color}-800`}>
                {children}
            </span>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in">
                        <div className="flex justify-between items-center p-4 border-b bg-blood text-white">
                            <h3 className="font-bold text-lg">{title}</h3>
                            <button onClick={onClose} className="hover:text-gray-200"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Application Screens ---

        const Navbar = ({ user, setView, handleLogout }) => (
            <nav className="bg-white shadow-md sticky top-0 z-40">
                <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('dashboard')}>
                        <i className="fas fa-heartbeat text-blood text-2xl"></i>
                        <span className="font-bold text-xl text-gray-800">Rokto<span className="text-blood">Bondhu</span> BD</span>
                    </div>
                    <div className="flex items-center gap-4">
                        {user ? (
                            <>
                                <button onClick={() => setView('dashboard')} className="hidden md:block text-gray-600 hover:text-blood font-medium">Dashboard</button>
                                <button onClick={() => setView('find-donors')} className="hidden md:block text-gray-600 hover:text-blood font-medium">Donors</button>
                                <button onClick={() => setView('requests')} className="hidden md:block text-gray-600 hover:text-blood font-medium">Requests</button>
                                <div className="relative group">
                                    <div className="w-8 h-8 rounded-full bg-blood text-white flex items-center justify-center font-bold cursor-pointer">
                                        {user.email[0].toUpperCase()}
                                    </div>
                                    <div className="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-xl py-2 hidden group-hover:block border">
                                        <button onClick={() => setView('profile')} className="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</button>
                                        <button onClick={handleLogout} className="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <Button onClick={() => setView('login')} variant="primary" className="text-sm px-4">Login / Join</Button>
                        )}
                    </div>
                </div>
            </nav>
        );

        const AuthScreen = ({ type, onAuthSuccess, setView }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const handleGoogleLogin = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    setLoading(true);
                    await auth.signInWithPopup(provider);
                    onAuthSuccess();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError("");
                try {
                    if (type === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                    onAuthSuccess();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[80vh] px-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-blood">
                        <h2 className="text-2xl font-bold text-center mb-6 text-gray-800">
                            {type === 'login' ? 'Welcome Back' : 'Join RoktoBondhu'}
                        </h2>
                        
                        {error && <div className="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">{error}</div>}

                        <Button onClick={handleGoogleLogin} variant="outline" className="w-full mb-4">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" />
                            Continue with Google
                        </Button>

                        <div className="relative my-6 text-center">
                            <hr className="border-gray-300" />
                            <span className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white px-2 text-sm text-gray-500">OR</span>
                        </div>

                        <form onSubmit={handleSubmit}>
                            <Input label="Email" value={email} onChange={(e) => setEmail(e.target.value)} required />
                            <Input label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
                            <Button type="submit" variant="primary" className="w-full" disabled={loading}>
                                {loading ? 'Processing...' : (type === 'login' ? 'Login' : 'Register')}
                            </Button>
                        </form>

                        <p className="mt-4 text-center text-sm text-gray-600">
                            {type === 'login' ? "Don't have an account?" : "Already have an account?"} 
                            <span onClick={() => setView(type === 'login' ? 'register' : 'login')} className="text-blood font-bold cursor-pointer ml-1 hover:underline">
                                {type === 'login' ? 'Register' : 'Login'}
                            </span>
                        </p>
                    </div>
                </div>
            );
        };

        const ProfileForm = ({ user, userProfile, onSave }) => {
            const [formData, setFormData] = useState({
                name: userProfile?.name || "",
                bloodGroup: userProfile?.bloodGroup || "",
                division: userProfile?.division || "",
                district: userProfile?.district || "",
                upazila: userProfile?.upazila || "",
                lastDonation: userProfile?.lastDonationDate || "",
                available: userProfile?.available ?? true
            });
            const [loading, setLoading] = useState(false);

            const divisions = Object.keys(BANGLADESH_DATA);
            const districts = formData.division ? BANGLADESH_DATA[formData.division] : [];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                
                const nextEligible = formData.lastDonation 
                    ? new Date(new Date(formData.lastDonation).getTime() + (90 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0]
                    : new Date().toISOString().split('T')[0];

                const data = {
                    ...formData,
                    uid: user.uid,
                    email: user.email,
                    role: userProfile?.role || 'user', // Prevent role hijacking
                    eligibleDate: nextEligible,
                    lastDonationDate: formData.lastDonation,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('users').doc(user.uid).set(data, { merge: true });
                setLoading(false);
                onSave();
            };

            return (
                <div className="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg mt-6">
                    <h2 className="text-xl font-bold mb-4 border-b pb-2">Complete Your Profile</h2>
                    <form onSubmit={handleSubmit}>
                        <Input label="Full Name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} required />
                        
                        <div className="grid grid-cols-2 gap-4">
                            <Select label="Blood Group" value={formData.bloodGroup} options={BLOOD_GROUPS} onChange={(e) => setFormData({...formData, bloodGroup: e.target.value})} placeholder="Select Group" />
                            <Select label="Division" value={formData.division} options={divisions} onChange={(e) => setFormData({...formData, division: e.target.value, district: ''})} placeholder="Select Division" />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <Select label="District" value={formData.district} options={districts} onChange={(e) => setFormData({...formData, district: e.target.value})} placeholder="Select District" />
                            <Input label="Upazila / Area" value={formData.upazila} onChange={(e) => setFormData({...formData, upazila: e.target.value})} placeholder="e.g. Dhanmondi" />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <Input label="Last Donation Date (Optional)" type="date" value={formData.lastDonation} onChange={(e) => setFormData({...formData, lastDonation: e.target.value})} />
                            
                            <div className="flex items-center mt-6">
                                <label className="flex items-center cursor-pointer">
                                    <input type="checkbox" className="w-5 h-5 text-blood rounded focus:ring-blood" checked={formData.available} onChange={(e) => setFormData({...formData, available: e.target.checked})} />
                                    <span className="ml-2 text-gray-700 font-medium">Available to Donate?</span>
                                </label>
                            </div>
                        </div>

                        <Button type="submit" variant="primary" className="w-full mt-4" disabled={loading}>
                            {loading ? 'Saving...' : 'Update Profile'}
                        </Button>
                    </form>
                </div>
            );
        };

        const RequestBlood = ({ user, onSuccess }) => {
            const [reqData, setReqData] = useState({
                patientName: "", hospital: "", bloodGroup: "", date: "", 
                urgency: "Normal", contact: "", division: "", district: ""
            });
            const [loading, setLoading] = useState(false);

            const divisions = Object.keys(BANGLADESH_DATA);
            const districts = reqData.division ? BANGLADESH_DATA[reqData.division] : [];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                // Check limit: 2 requests per day
                const todayStart = new Date();
                todayStart.setHours(0,0,0,0);
                const query = await db.collection('requests')
                    .where('createdBy', '==', user.uid)
                    .where('createdAt', '>=', todayStart)
                    .get();

                if (query.size >= 2) {
                    alert("Daily limit reached. You can only post 2 requests per day.");
                    setLoading(false);
                    return;
                }

                await db.collection('requests').add({
                    ...reqData,
                    createdBy: user.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'active'
                });
                setLoading(false);
                onSuccess();
            };

            return (
                <div className="bg-white p-6 rounded-xl shadow-lg border-l-4 border-blood">
                    <h2 className="text-xl font-bold mb-4 text-blood"><i className="fas fa-bullhorn mr-2"></i>Request Emergency Blood</h2>
                    <form onSubmit={handleSubmit}>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <Input label="Patient Name" value={reqData.patientName} onChange={(e) => setReqData({...reqData, patientName: e.target.value})} required />
                            <Input label="Hospital Name" value={reqData.hospital} onChange={(e) => setReqData({...reqData, hospital: e.target.value})} required />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <Select label="Blood Group" value={reqData.bloodGroup} options={BLOOD_GROUPS} onChange={(e) => setReqData({...reqData, bloodGroup: e.target.value})} placeholder="Select" />
                            <Input label="Required Date" type="date" value={reqData.date} onChange={(e) => setReqData({...reqData, date: e.target.value})} required />
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                             <Select label="Division" value={reqData.division} options={divisions} onChange={(e) => setReqData({...reqData, division: e.target.value, district: ''})} placeholder="Division" />
                             <Select label="District" value={reqData.district} options={districts} onChange={(e) => setReqData({...reqData, district: e.target.value})} placeholder="District" />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <Input label="Contact Number" value={reqData.contact} onChange={(e) => setReqData({...reqData, contact: e.target.value})} required placeholder="017..." />
                            
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Urgency</label>
                                <select value={reqData.urgency} onChange={(e) => setReqData({...reqData, urgency: e.target.value})} className="w-full p-2 border border-gray-300 rounded-md">
                                    <option value="Normal">Normal</option>
                                    <option value="Emergency"> Emergency</option>
                                </select>
                            </div>
                        </div>

                        <Button type="submit" variant="primary" className="w-full bg-blood text-white" disabled={loading}>
                            {loading ? 'Posting...' : 'Post Request'}
                        </Button>
                    </form>
                </div>
            );
        };

        const DonorList = ({ user }) => {
            const [donors, setDonors] = useState([]);
            const [filters, setFilters] = useState({ group: '', division: '', district: '' });
            const [loading, setLoading] = useState(false);

            const fetchDonors = async () => {
                setLoading(true);
                let ref = db.collection('users').where('available', '==', true);
                
                if (filters.group) ref = ref.where('bloodGroup', '==', filters.group);
                if (filters.division) ref = ref.where('division', '==', filters.division);
                if (filters.district) ref = ref.where('district', '==', filters.district);

                const snap = await ref.limit(50).get();
                const fetched = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Client side filtering for 90 days eligibility rule
                // Note: Complex date logic is hard in basic Firestore queries without storing timestamp ints
                const eligibleDonors = fetched.filter(d => isEligible(d.lastDonationDate, d.available));
                setDonors(eligibleDonors);
                setLoading(false);
            };

            useEffect(() => { fetchDonors(); }, [filters]);

            return (
                <div className="container mx-auto p-4">
                    <h2 className="text-2xl font-bold mb-6 text-gray-800">Find Blood Donors</h2>
                    
                    {/* Filters */}
                    <div className="bg-white p-4 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Select label="Blood Group" value={filters.group} options={BLOOD_GROUPS} onChange={(e) => setFilters({...filters, group: e.target.value})} placeholder="Any Group" />
                        <Select label="Division" value={filters.division} options={Object.keys(BANGLADESH_DATA)} onChange={(e) => setFilters({...filters, division: e.target.value, district: ''})} placeholder="Any Division" />
                        <Select label="District" value={filters.district} options={filters.division ? BANGLADESH_DATA[filters.division] : []} onChange={(e) => setFilters({...filters, district: e.target.value})} placeholder="Any District" />
                    </div>

                    {loading ? <div className="text-center py-10">Loading...</div> : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {donors.length > 0 ? donors.map(donor => (
                                <div key={donor.id} className="bg-white rounded-xl shadow-md p-5 border-l-4 border-blood hover:shadow-lg transition">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-bold text-lg">{donor.name}</h3>
                                            <p className="text-sm text-gray-500"><i className="fas fa-map-marker-alt mr-1"></i>{donor.district}, {donor.division}</p>
                                            <p className="text-xs text-gray-400 mt-1">{donor.upazila}</p>
                                        </div>
                                        <div className="bg-blood-bg text-blood font-bold p-3 rounded-full w-12 h-12 flex items-center justify-center text-lg">
                                            {donor.bloodGroup}
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center">
                                        <span className="text-xs text-green-600 font-bold bg-green-50 px-2 py-1 rounded">Eligible</span>
                                        {/* Hide contact publicly, implement a request feature or simple logic */}
                                        <button className="text-blood text-sm font-semibold" onClick={() => alert("For privacy, please post a Blood Request. Eligible donors will be notified.")}>
                                            Contact
                                        </button>
                                    </div>
                                </div>
                            )) : <p className="text-gray-500 col-span-3 text-center">No eligible donors found matching criteria.</p>}
                        </div>
                    )}
                </div>
            );
        };

        const RequestFeed = ({ user, isAdmin }) => {
            const [requests, setRequests] = useState([]);

            useEffect(() => {
                const unsubscribe = db.collection('requests')
                    .where('status', '==', 'active')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .onSnapshot(snap => {
                        setRequests(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                return () => unsubscribe();
            }, []);

            const reportRequest = async (id) => {
                const reason = prompt("Why are you reporting this?");
                if(reason) {
                    await db.collection('reports').add({
                        requestId: id,
                        reportedBy: user.uid,
                        reason: reason,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("Report submitted for review.");
                }
            };

            const deleteRequest = async (id) => {
                if(confirm("Admin: Delete this request?")) {
                    await db.collection('requests').doc(id).update({ status: 'deleted' });
                }
            };

            return (
                <div className="mt-8">
                    <h3 className="text-xl font-bold mb-4 text-gray-800">Recent Emergency Requests</h3>
                    <div className="space-y-4">
                        {requests.map(req => (
                            <div key={req.id} className={`bg-white p-5 rounded-lg shadow-md border-l-4 ${req.urgency === 'Emergency' ? 'border-red-600 bg-red-50' : 'border-blue-500'}`}>
                                <div className="flex justify-between">
                                    <div>
                                        <h4 className="font-bold text-lg">{req.patientName} <span className="text-xs font-normal text-gray-500">at {req.hospital}</span></h4>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="bg-white border px-2 py-0.5 rounded text-sm font-bold text-blood">{req.bloodGroup}</span>
                                            <span className="text-sm text-gray-600"><i className="fas fa-map-marker-alt"></i> {req.district}</span>
                                        </div>
                                        <p className="text-sm mt-2 font-medium">Needed: {req.date}</p>
                                    </div>
                                    <div className="text-right">
                                        <a href={`tel:${req.contact}`} className="bg-blood text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow hover:bg-blood-dark inline-block mb-2">
                                            <i className="fas fa-phone-alt mr-1"></i> Call
                                        </a>
                                        <div className="flex gap-2 justify-end">
                                            <button onClick={() => reportRequest(req.id)} className="text-xs text-gray-400 hover:text-red-500 underline">Report</button>
                                            {isAdmin && <button onClick={() => deleteRequest(req.id)} className="text-xs text-red-600 font-bold">Delete</button>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                        {requests.length === 0 && <p className="text-center text-gray-500">No active requests.</p>}
                    </div>
                </div>
            );
        };

        const AdminDashboard = () => {
            const [stats, setStats] = useState({ totalUsers: 0, totalRequests: 0, byGroup: {} });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadStats = async () => {
                    // Note: In real production, use Cloud Functions for aggregated counters to save reads.
                    // This is a simplified CDN-only version.
                    const userSnap = await db.collection('users').get();
                    const reqSnap = await db.collection('requests').get();
                    
                    const groups = {};
                    userSnap.docs.forEach(doc => {
                        const bg = doc.data().bloodGroup;
                        if(bg) groups[bg] = (groups[bg] || 0) + 1;
                    });

                    setStats({
                        totalUsers: userSnap.size,
                        totalRequests: reqSnap.size,
                        byGroup: groups
                    });
                    setLoading(false);
                };
                loadStats();
            }, []);

            if(loading) return <div>Loading Stats...</div>;

            return (
                <div className="p-6">
                    <h2 className="text-2xl font-bold mb-6">Admin Dashboard</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                            <h3 className="text-gray-500 text-sm">Total Donors</h3>
                            <p className="text-3xl font-bold">{stats.totalUsers}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow border-t-4 border-blood">
                            <h3 className="text-gray-500 text-sm">Total Requests</h3>
                            <p className="text-3xl font-bold">{stats.totalRequests}</p>
                        </div>
                    </div>

                    <h3 className="font-bold mb-4">Donors by Group</h3>
                    <div className="grid grid-cols-4 md:grid-cols-8 gap-4">
                        {Object.entries(stats.byGroup).map(([group, count]) => (
                            <div key={group} className="bg-white p-3 rounded shadow text-center">
                                <div className="font-bold text-blood">{group}</div>
                                <div className="text-gray-600">{count}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Main App Controller ---

        const App = () => {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [view, setView] = useState('landing'); // landing, login, register, dashboard, profile, find-donors, requests
            const [loading, setLoading] = useState(true);
            const [modals, setModals] = useState({ privacy: false, terms: false });

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        // Fetch profile
                        const doc = await db.collection('users').doc(u.uid).get();
                        if (doc.exists) {
                            setUserProfile(doc.data());
                            setView('dashboard');
                        } else {
                            setView('profile'); // Force profile completion
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                        setView('landing');
                    }
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            const handleLogout = () => {
                auth.signOut();
                setView('landing');
            };

            const isAdmin = userProfile?.role === 'admin';

            if (loading) return <div className="flex h-screen items-center justify-center text-blood text-xl font-bold animate-pulse">Loading RoktoBondhu...</div>;

            // View Router
            let content;
            if (!user && (view === 'login' || view === 'register')) {
                content = <AuthScreen type={view} setView={setView} onAuthSuccess={() => {}} />;
            } else if (!user) {
                // Landing Page
                content = (
                    <div className="min-h-screen flex flex-col">
                        <header className="bg-blood text-white py-20 px-4 text-center">
                            <h1 className="text-4xl md:text-6xl font-bold mb-4 animate-fade-in">Every Drop Counts</h1>
                            <p className="text-lg md:text-xl mb-8 opacity-90 max-w-2xl mx-auto">Connect with blood donors across Bangladesh instantly. A secure, reliable platform for saving lives.</p>
                            <div className="flex justify-center gap-4">
                                <Button onClick={() => setView('login')} className="bg-white text-blood hover:bg-gray-100 text-lg px-8">Find Blood</Button>
                                <Button onClick={() => setView('register')} variant="outline" className="border-white text-white hover:bg-white hover:text-blood text-lg px-8">Be a Donor</Button>
                            </div>
                        </header>
                        <section className="py-16 px-4 container mx-auto text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-12">Why RoktoBondhu?</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="p-6 bg-white rounded-xl shadow-md">
                                    <i className="fas fa-search-location text-4xl text-blood mb-4"></i>
                                    <h3 className="text-xl font-bold mb-2">Location Based</h3>
                                    <p className="text-gray-600">Find donors in your specific District and Upazila.</p>
                                </div>
                                <div className="p-6 bg-white rounded-xl shadow-md">
                                    <i className="fas fa-shield-alt text-4xl text-blood mb-4"></i>
                                    <h3 className="text-xl font-bold mb-2">Verified & Secure</h3>
                                    <p className="text-gray-600">Secure Google login and verified donor availability status.</p>
                                </div>
                                <div className="p-6 bg-white rounded-xl shadow-md">
                                    <i className="fas fa-heart text-4xl text-blood mb-4"></i>
                                    <h3 className="text-xl font-bold mb-2">Free Forever</h3>
                                    <p className="text-gray-600">A non-profit initiative for the people of Bangladesh.</p>
                                </div>
                            </div>
                        </section>
                    </div>
                );
            } else {
                // Authenticated Views
                switch(view) {
                    case 'profile':
                        content = <ProfileForm user={user} userProfile={userProfile} onSave={() => { setView('dashboard'); window.location.reload(); }} />;
                        break;
                    case 'find-donors':
                        content = <DonorList user={user} />;
                        break;
                    case 'requests':
                        content = (
                            <div className="container mx-auto p-4 max-w-4xl">
                                <div className="mb-6 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">Blood Requests</h2>
                                    <Button onClick={() => setView('dashboard')} variant="primary">New Request</Button>
                                </div>
                                <RequestFeed user={user} isAdmin={isAdmin} />
                            </div>
                        );
                        break;
                    case 'admin':
                        content = isAdmin ? <AdminDashboard /> : <div className="p-10 text-center text-red-600">Access Denied</div>;
                        break;
                    case 'dashboard':
                    default:
                        content = (
                            <div className="container mx-auto p-4 max-w-6xl">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                    {/* Sidebar / Info */}
                                    <div className="md:col-span-4 space-y-6">
                                        <div className="bg-white p-6 rounded-xl shadow-md border-t-4 border-blood">
                                            <div className="flex items-center gap-4 mb-4">
                                                <div className="bg-gray-100 p-3 rounded-full">
                                                    <i className="fas fa-user text-2xl text-gray-600"></i>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-lg">{userProfile?.name || "User"}</h3>
                                                    <p className="text-sm text-gray-500">{userProfile?.bloodGroup || "No Group"}</p>
                                                </div>
                                            </div>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Status:</span>
                                                    <span className={userProfile?.available ? "text-green-600 font-bold" : "text-red-500 font-bold"}>
                                                        {userProfile?.available ? "Available" : "Unavailable"}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Last Donation:</span>
                                                    <span>{userProfile?.lastDonationDate || "Never"}</span>
                                                </div>
                                            </div>
                                            <Button onClick={() => setView('profile')} variant="outline" className="w-full mt-4 text-sm">Edit Profile</Button>
                                            
                                            {isAdmin && (
                                                <Button onClick={() => setView('admin')} variant="secondary" className="w-full mt-2 text-sm">Admin Panel</Button>
                                            )}
                                        </div>

                                        <div className="bg-blood text-white p-6 rounded-xl shadow-md">
                                            <h3 className="font-bold text-xl mb-2">Need Blood?</h3>
                                            <p className="text-sm opacity-90 mb-4">Create an emergency request to notify eligible donors.</p>
                                            <Button onClick={() => { document.getElementById('req-form').scrollIntoView({behavior: 'smooth'}) }} className="bg-white text-blood w-full">Request Now</Button>
                                        </div>
                                    </div>

                                    {/* Main Feed */}
                                    <div className="md:col-span-8">
                                        <div id="req-form" className="mb-8">
                                            <RequestBlood user={user} onSuccess={() => alert("Request Posted Successfully!")} />
                                        </div>
                                        <RequestFeed user={user} isAdmin={isAdmin} />
                                    </div>
                                </div>
                            </div>
                        );
                        break;
                }
            }

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar user={user} setView={setView} handleLogout={handleLogout} />
                    <main className="flex-grow bg-gray-50">
                        {content}
                    </main>
                    <footer className="bg-gray-800 text-gray-400 py-6 mt-auto">
                        <div className="container mx-auto px-4 text-center">
                            <p className="mb-2">&copy; 2024 RoktoBondhu BD. All rights reserved.</p>
                            <div className="flex justify-center gap-4 text-sm">
                                <button onClick={() => setModals({...modals, privacy: true})} className="hover:text-white">Privacy Policy</button>
                                <button onClick={() => setModals({...modals, terms: true})} className="hover:text-white">Disclaimer</button>
                            </div>
                        </div>
                    </footer>

                    {/* Modals */}
                    <Modal isOpen={modals.privacy} onClose={() => setModals({...modals, privacy: false})} title="Privacy Policy">
                        <p className="text-sm text-gray-600">
                            We respect your privacy. Donor contact details are hidden from the public list and are only shared or utilized when a specific request is made or via direct secure communication channels (to be implemented). We do not sell your data.
                        </p>
                    </Modal>
                    <Modal isOpen={modals.terms} onClose={() => setModals({...modals, terms: false})} title="Medical Disclaimer">
                        <p className="text-sm text-gray-600">
                            RoktoBondhu BD is a platform to connect donors and patients. We do not verify the medical quality of blood. Verification of donor health and blood compatibility must be done by medical professionals at the hospital.
                        </p>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- 
    ========================================================================
    SETUP INSTRUCTIONS
    ========================================================================
    
    1. CREATE FIREBASE PROJECT:
       - Go to https://console.firebase.google.com/
       - Create a new project "RoktoBondhu".
    
    2. ENABLE AUTHENTICATION:
       - Go to Build -> Authentication -> Sign-in method.
       - Enable "Email/Password".
       - Enable "Google".

    3. CREATE FIRESTORE DATABASE:
       - Go to Build -> Firestore Database -> Create Database.
       - Start in **Production Mode**.
       - Select a location (e.g., asia-southeast1 for Singapore/Bangladesh latency).

    4. FIRESTORE SECURITY RULES (Copy this to Rules tab):
       
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           
           // Helper to check if user is admin
           function isAdmin() {
             return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
           }

           // USERS Collection
           match /users/{userId} {
             allow read: if request.auth != null;
             // Users can create/update their own profile, but CANNOT change their role to admin
             allow create: if request.auth.uid == userId && request.resource.data.role == 'user';
             allow update: if request.auth.uid == userId && request.resource.data.role == resource.data.role;
           }

           // REQUESTS Collection
           match /requests/{reqId} {
             allow read: if true;
             allow create: if request.auth != null;
             // Only creator or Admin can update (e.g., mark as fulfilled or deleted)
             allow update: if request.auth.uid == resource.data.createdBy || isAdmin();
           }

           // REPORTS Collection
           match /reports/{reportId} {
             allow create: if request.auth != null;
             allow read, update, delete: if isAdmin();
           }
         }
       }

    5. DEPLOYMENT:
       - This is a single index.html file.
       - You can drop this file into Netlify Drop (https://app.netlify.com/drop).
       - Or use Firebase Hosting: `firebase init` -> select Hosting -> set public dir to current folder -> deploy.

    6. CONFIGURATION:
       - Replace the `firebaseConfig` object at the top of the <script> tag with your own keys from Project Settings.
    -->
</body>
</html>
