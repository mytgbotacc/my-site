<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Work Submit</title>
    
    <!-- Telegram Script must be at the very top -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- FontAwesome (Latest Version for Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // Tailwind Config
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        lightBg: '#f3f4f6',
                        lightCard: '#ffffff'
                    }
                }
            }
        }

        // --- GLOBAL TELEGRAM INITIALIZATION (CRITICAL FIX) ---
        // React লোড হওয়ার আগেই আমরা টেলিগ্রামের ডাটা ভেরিয়েবলে নিয়ে নিচ্ছি
        window.tgGlobal = window.Telegram.WebApp;
        window.tgGlobal.ready();
        window.tgGlobal.expand();
        
        // ইউজার ডাটা চেক করা (যদি রিপ্লাই বাটন থেকে আসে)
        window.userGlobal = window.tgGlobal.initDataUnsafe?.user || null;
        
        // ডার্ক মোড অটো চেক
        if (window.tgGlobal.colorScheme === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 0.5rem center; background-size: 1em;
        }
        /* Loading Animation */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-anim { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="bg-lightBg text-gray-900 dark:bg-darkBg dark:text-white transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const supabase = window.supabase.createClient('https://jmnndvfepbuomprtwdsl.supabase.co', 'sb_publishable_rYvGNp6Hve-pEgOKwBXCZA_CPq_4_W9');

        // --- COMPONENT: Success Modal ---
        const SuccessModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                <div className="bg-white dark:bg-darkCard rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl popup-anim relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-green-500"></div>
                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i className="fa-solid fa-check text-4xl text-green-500"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-2">সফল হয়েছে!</h2>
                    <p className="text-gray-500 dark:text-gray-300 mb-6 text-sm">আপনার কাজ সফলভাবে সাবমিট হয়েছে।</p>
                    <button onClick={onClose} className="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition">ঠিক আছে</button>
                </div>
            </div>
        );

        // --- COMPONENT: Loading Screen ---
        const LoadingScreen = ({ onComplete }) => {
            const [progress, setProgress] = useState(0);
            useEffect(() => {
                // Faking loading just a bit faster for better UX
                const interval = setInterval(() => {
                    setProgress((old) => {
                        if (old >= 100) { clearInterval(interval); setTimeout(onComplete, 200); return 100; }
                        return Math.min(old + Math.random() * 25, 100);
                    });
                }, 100);
                return () => clearInterval(interval);
            }, [onComplete]);

            return (
                <div className="fixed inset-0 bg-[#0f172a] z-[100] flex flex-col items-center justify-center text-white">
                    <div className="w-20 h-20 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <h2 className="text-xl font-bold text-blue-400">Infinity Work</h2>
                    <p className="text-gray-400 text-sm mt-2">Connecting...</p>
                </div>
            );
        };

        // --- COMPONENT: Form Screen ---
        const FormScreen = ({ service, user, onBack }) => {
            const [file, setFile] = useState(null);
            const [sheetContent, setSheetContent] = useState(null);
            const [formData, setFormData] = useState({});
            const [options, setOptions] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const fetchOpts = async () => { 
                    const { data } = await supabase.from('service_options').select('*').eq('service_id', service.id); 
                    if(data) setOptions(data); 
                };
                fetchOpts();
            }, [service]);

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleFileChange = (e) => { 
                if (e.target.files.length > 0) {
                    const selectedFile = e.target.files[0];
                    setFile(selectedFile);
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        setSheetContent(data);
                    };
                    reader.readAsBinaryString(selectedFile);
                }
            };

            const handleSubmit = async () => {
                if(!file) return alert("Please upload an Excel file");
                setIsSubmitting(true);
                try {
                    const fileName = `${user.id}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                    const { error: upErr } = await supabase.storage.from('work_files').upload(fileName, file); 
                    if(upErr) throw upErr;
                    
                    const { data: { publicUrl } } = supabase.storage.from('work_files').getPublicUrl(fileName);
                    
                    const submissionData = { 
                        user_id: user.id.toString(), 
                        username: user.username || "No Username", 
                        service_name: service.name, 
                        file_name: file.name, 
                        file_url: publicUrl, 
                        form_data: { ...formData, sheet_content: sheetContent }
                    };
                    
                    const { error } = await supabase.from('submissions').insert([submissionData]); 
                    if(error) throw error;
                    setShowSuccess(true);
                } catch (e) { alert("Error: " + e.message); } 
                finally { setIsSubmitting(false); }
            };

            const getOpts = (cat) => options.filter(o => o.category_name === cat);
            const displayUser = user.username ? `@${user.username}` : "No Username";
            const displayId = user.id ? user.id.toString() : "Unknown ID";

            return (
                <div className="min-h-screen bg-lightBg dark:bg-darkBg pb-10">
                    {showSuccess && <SuccessModal onClose={() => { setShowSuccess(false); window.location.reload(); }} />}
                    
                    <div className="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-700 shadow-sm sticky top-0 bg-white dark:bg-darkCard z-20">
                        <button onClick={onBack} className="p-2 -ml-2"><i className="fa-solid fa-arrow-left text-xl text-gray-600 dark:text-gray-300"></i></button>
                        <span className="font-bold text-lg text-gray-800 dark:text-white">Submit Work</span>
                        <div className="w-8"></div>
                    </div>

                    <div className="p-5">
                        <h2 className="text-center text-2xl font-bold text-blue-600 dark:text-blue-400 mb-6 mt-2">{service.name} Submit</h2>
                        
                        {sheetContent && (
                            <div className="mb-6 p-3 bg-green-50 border border-green-200 rounded-lg dark:bg-green-900/20 dark:border-green-800 flex gap-3 items-center">
                                <i className="fa-solid fa-file-excel text-green-600 text-2xl"></i>
                                <div><p className="font-bold text-green-700 dark:text-green-400">Excel Loaded</p><p className="text-xs text-green-600 dark:text-green-300">{sheetContent.length} Rows detected</p></div>
                            </div>
                        )}

                        <div className="space-y-4">
                            {/* Dynamic Dropdowns */}
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">Account Type</label><select name="Account Type" onChange={handleChange} className="custom-select w-full border dark:border-gray-600 rounded-lg p-2.5 text-sm bg-white dark:bg-darkCard dark:text-white"><option>Select</option>{getOpts('Account Type').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">Mail Type</label><select name="Mail Type" onChange={handleChange} className="custom-select w-full border dark:border-gray-600 rounded-lg p-2.5 text-sm bg-white dark:bg-darkCard dark:text-white"><option>Select</option>{getOpts('Mail Type').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">2FA-Cook</label><select name="2FA-Cook" onChange={handleChange} className="custom-select w-full border dark:border-gray-600 rounded-lg p-2 text-xs bg-white dark:bg-darkCard dark:text-white"><option>Select</option>{getOpts('2FA-Cook').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">Friends</label><select name="Friends" onChange={handleChange} className="custom-select w-full border dark:border-gray-600 rounded-lg p-2 text-xs bg-white dark:bg-darkCard dark:text-white"><option>Select</option>{getOpts('Friends').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">Total Id</label><input type="number" name="Total Id" onChange={handleChange} className="w-full border dark:border-gray-600 rounded-lg p-2 text-xs bg-white dark:bg-darkCard dark:text-white" placeholder="0"/></div>
                            </div>

                            {/* LOCKED USER DATA */}
                            <div className="bg-gray-100 dark:bg-gray-800 p-3 rounded-lg border border-gray-200 dark:border-gray-700 mt-2">
                                <div className="flex items-center gap-2 mb-2"><i className="fa-solid fa-lock text-gray-400 text-xs"></i><span className="text-xs font-bold text-gray-500 uppercase">Telegram Info</span></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="text-[10px] text-gray-400 block mb-1">Username</label><input value={displayUser} disabled className="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded p-2 text-xs font-mono text-gray-600 dark:text-gray-300"/></div>
                                    <div><label className="text-[10px] text-gray-400 block mb-1">User ID</label><input value={displayId} disabled className="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded p-2 text-xs font-mono text-gray-600 dark:text-gray-300"/></div>
                                </div>
                            </div>

                            <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 bg-white dark:bg-darkCard transition mt-2">
                                <i className="fa-solid fa-cloud-arrow-up text-3xl text-blue-500 mb-2"></i>
                                {file ? <p className="font-bold text-blue-600 text-sm">{file.name}</p> : <p className="text-sm text-gray-500">Tap to upload Excel file</p>}
                                <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".xlsx, .xls" />
                            </div>

                            <button onClick={handleSubmit} disabled={isSubmitting} className="w-full h-12 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 active:scale-95 transition disabled:opacity-70 mt-4">
                                {isSubmitting ? 'Uploading...' : 'Submit Now'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENT: Dashboard ---
        const Dashboard = ({ user, onSelectService, toggleTheme, isDarkMode }) => {
            const [services, setServices] = useState([]);
            const [appSettings, setAppSettings] = useState({ notice_text: "Loading notice...", thumbnail_url: null, video_url: "#" });

            useEffect(() => {
                const fetchData = async () => {
                    // Parallel fetching for speed
                    const [svcRes, setRes] = await Promise.all([
                        supabase.from('services').select('*').order('id'),
                        supabase.from('settings').select('*').single()
                    ]);
                    if (svcRes.data) setServices(svcRes.data);
                    if (setRes.data) setAppSettings(setRes.data);
                };
                fetchData();
            }, []);

            // Helper to render icon: Checks if it's an Image URL or Class Name
            const renderIcon = (iconStr) => {
                if (!iconStr) return <i className="fa-solid fa-briefcase"></i>;
                if (iconStr.includes('http')) {
                    return <img src={iconStr} className="w-8 h-8 object-contain" alt="icon" />;
                }
                // Fix for just "facebook" vs "fa-brands fa-facebook"
                const className = iconStr.includes('fa-') ? iconStr : `fa-brands fa-${iconStr}`;
                return <i className={`${className} text-2xl`}></i>;
            };

            const initial = user.first_name ? user.first_name[0] : 'G';

            return (
                <div className="bg-lightBg dark:bg-darkBg min-h-screen transition-colors duration-300">
                    {/* Header */}
                    <div className="bg-white dark:bg-darkCard px-5 py-4 flex justify-between items-center shadow-sm sticky top-0 z-10">
                        <div className="flex items-center gap-2">
                            <i className="fa-solid fa-robot text-2xl text-blue-600"></i>
                            <span className="font-bold text-lg dark:text-white">Infinity Work</span>
                        </div>
                        <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                            {isDarkMode ? <i className="fa-solid fa-sun text-yellow-400"></i> : <i className="fa-solid fa-moon text-gray-600"></i>}
                        </button>
                    </div>

                    <div className="p-5 space-y-6">
                        {/* Profile Section */}
                        <div className="bg-white dark:bg-darkCard rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100 dark:border-gray-700">
                            <div className="w-16 h-16 rounded-full border-2 border-blue-500 p-0.5">
                                {user.photo_url ? 
                                    <img src={user.photo_url} className="w-full h-full rounded-full object-cover" /> : 
                                    <div className="w-full h-full rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-2xl">{initial}</div>
                                }
                            </div>
                            <div>
                                <h2 className="font-bold text-xl text-gray-800 dark:text-white">{user.first_name} {user.last_name}</h2>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 text-xs px-2 py-0.5 rounded-full font-mono">
                                        ID: {user.id}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Banner */}
                        <div className="relative rounded-2xl overflow-hidden h-44 shadow-lg group cursor-pointer">
                            <img src={appSettings.thumbnail_url || "https://placehold.co/600x400/1e3a8a/FFF?text=Tutorial"} className="w-full h-full object-cover transition duration-500 group-hover:scale-110" />
                            <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                                <a href={appSettings.video_url} target="_blank" className="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border border-white/50 text-white text-xl shadow-lg hover:scale-110 transition">
                                    <i className="fa-solid fa-play ml-1"></i>
                                </a>
                            </div>
                            <div className="absolute bottom-4 right-4 text-right">
                                <h2 className="text-white font-bold text-xl leading-tight shadow-black drop-shadow-lg">কিভাবে<br/>কাজ জমা<br/>দিবেন!</h2>
                            </div>
                        </div>

                        {/* Notice */}
                        <div className="bg-white dark:bg-darkCard p-4 rounded-xl border-l-4 border-red-500 shadow-sm">
                            <h3 className="text-red-500 font-bold flex items-center gap-2 mb-1"><i className="fa-solid fa-bullhorn"></i> নোটিশ</h3>
                            <p className="text-sm text-gray-600 dark:text-gray-300">{appSettings.notice_text}</p>
                        </div>

                        {/* Services Grid (Fixed Icons) */}
                        <div>
                            <h3 className="font-bold text-gray-700 dark:text-gray-200 mb-3 ml-1">All Services</h3>
                            <div className="grid grid-cols-3 gap-3">
                                {services.length === 0 ? <p className="col-span-3 text-center text-gray-400 py-4">Loading Services...</p> : 
                                services.map(s => (
                                    <div key={s.id} onClick={() => onSelectService(s)} className="bg-white dark:bg-darkCard p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 h-32 justify-center active:scale-95 transition cursor-pointer">
                                        <div className="w-12 h-12 rounded-full flex items-center justify-center text-white shadow-md" style={{backgroundColor: s.color || '#3b82f6'}}>
                                            {renderIcon(s.icon)}
                                        </div>
                                        <span className="text-xs font-bold text-center text-gray-700 dark:text-gray-300 leading-tight">{s.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="h-4"></div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [screen, setScreen] = useState("loading");
            const [selectedService, setSelectedService] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            // CRITICAL: Initialize with Global Data immediately
            // This prevents "Guest" flashing if data is present
            const [user, setUser] = useState(window.userGlobal || { 
                id: "Guest", first_name: "Guest", last_name: "", username: null 
            });

            useEffect(() => {
                // If global data wasn't ready at script start, try again here
                if (!window.userGlobal && window.tgGlobal.initDataUnsafe?.user) {
                    setUser(window.tgGlobal.initDataUnsafe.user);
                }
                
                if (document.documentElement.classList.contains('dark')) {
                    setIsDarkMode(true);
                }
            }, []);

            const toggleTheme = () => {
                const newMode = !isDarkMode;
                setIsDarkMode(newMode);
                document.documentElement.classList.toggle('dark', newMode);
            };

            return (
                <React.Fragment>
                    {screen === "loading" && <LoadingScreen onComplete={() => setScreen("dashboard")} />}
                    {screen === "dashboard" && <Dashboard user={user} onSelectService={s => {setSelectedService(s); setScreen("form");}} toggleTheme={toggleTheme} isDarkMode={isDarkMode} />}
                    {screen === "form" && selectedService && <FormScreen service={selectedService} user={user} onBack={() => setScreen("dashboard")} />}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
