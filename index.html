<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Work</title>
    
    <!-- Telegram Script (Must be first) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- React & Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // 🔹 Supabase Config
        const supabase = window.supabase.createClient('https://jmnndvfepbuomprtwdsl.supabase.co', 'sb_publishable_rYvGNp6Hve-pEgOKwBXCZA_CPq_4_W9');

        // --- 1. Loading Screen ---
        const LoadingScreen = () => (
            <div className="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
                <div className="loader mb-4"></div>
                <p className="text-gray-500 font-medium animate-pulse">Connecting...</p>
            </div>
        );

        // --- 2. Dashboard Component ---
        const Dashboard = ({ user, services, appSettings, onServiceClick, onHistoryClick }) => {
            return (
                <div className="min-h-screen pb-10 bg-gray-50">
                    {/* Header */}
                    <div className="bg-white px-4 py-3 sticky top-0 z-20 flex justify-between items-center shadow-sm border-b">
                        <div className="flex items-center gap-2">
                            <i className="fa-solid fa-robot text-2xl text-blue-600"></i>
                            <span className="font-bold text-lg text-gray-800">Infinity Work</span>
                        </div>
                        <button onClick={onHistoryClick} className="text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition">
                            <i className="fa-solid fa-clock-rotate-left text-xl"></i>
                        </button>
                    </div>

                    <div className="p-4 space-y-5">
                        {/* User Profile Card (Updated Logic) */}
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                {/* Photo or Initials */}
                                {user.photo_url ? (
                                    <img src={user.photo_url} alt="Profile" className="w-12 h-12 rounded-full border-2 border-blue-500" />
                                ) : (
                                    <div className="w-12 h-12 rounded-full bg-blue-500 text-white flex items-center justify-center text-xl font-bold shadow-md uppercase">
                                        {user.first_name ? user.first_name[0] : <i className="fa-solid fa-user"></i>}
                                    </div>
                                )}
                                
                                <div>
                                    <h2 className="font-bold text-gray-800 text-lg leading-tight">
                                        {user.first_name} {user.last_name}
                                    </h2>
                                    <p className="text-gray-400 text-xs font-medium">
                                        ID: {user.id ? user.id : "Waiting..."}
                                    </p>
                                </div>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-yellow-50 flex items-center justify-center border border-yellow-100">
                                <i className="fa-solid fa-moon text-yellow-500"></i>
                            </div>
                        </div>

                        {/* Banner/Video */}
                        <div className="relative rounded-2xl overflow-hidden h-44 bg-blue-800 shadow-lg flex items-center justify-center group">
                            {appSettings?.thumbnail_url && (
                                <img src={appSettings.thumbnail_url} className="absolute inset-0 w-full h-full object-cover opacity-50" />
                            )}
                            <div className="absolute z-10 text-right w-full pr-6 top-6">
                                <h2 className="text-white text-2xl font-bold leading-tight drop-shadow-md">
                                    কিভাবে<br/>কাজ জমা<br/>দিবেন!
                                </h2>
                            </div>
                            <a href={appSettings?.video_url || '#'} target="_blank" className="relative z-10 w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/50 text-white shadow-xl hover:bg-white/30 transition mt-10">
                                <i className="fa-solid fa-play text-xl ml-1"></i>
                            </a>
                        </div>

                        {/* Notice */}
                        <div className="bg-white rounded-xl p-4 shadow-sm border-l-4 border-red-500 flex gap-3 items-start">
                            <i className="fa-solid fa-bullhorn text-red-500 mt-1"></i>
                            <div>
                                <h3 className="font-bold text-gray-800 text-sm">Notice</h3>
                                <p className="text-gray-500 text-xs mt-1">
                                    {appSettings?.notice_text || "আস সালামু আলাইকুম"}
                                </p>
                            </div>
                        </div>

                        {/* Services Grid */}
                        <div className="grid grid-cols-2 gap-4">
                            {services.map((service) => (
                                <div 
                                    key={service.id} 
                                    onClick={() => onServiceClick(service)}
                                    className="bg-white rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm border border-gray-100 active:scale-95 transition cursor-pointer hover:shadow-md h-36"
                                >
                                    <img src={service.icon} alt={service.name} className="w-14 h-14 mb-3 object-contain" />
                                    <span className="font-bold text-gray-800 text-sm">{service.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3. Form Component (Fixed Inputs) ---
        const FormScreen = ({ service, user, onBack }) => {
            const [file, setFile] = useState(null);
            const [sheetContent, setSheetContent] = useState(null);
            const [formData, setFormData] = useState({});
            const [options, setOptions] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const fetchOpts = async () => { 
                    const { data } = await supabase.from('service_options').select('*').eq('service_id', service.id); 
                    if(data) setOptions(data); 
                };
                fetchOpts();
            }, [service]);

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleFileChange = (e) => { 
                if (e.target.files.length > 0) {
                    const f = e.target.files[0];
                    setFile(f);
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        setSheetContent(data);
                    };
                    reader.readAsBinaryString(f);
                }
            };

            const handleSubmit = async () => {
                if(!file || !sheetContent) return alert("❌ ফাইল আপলোড করুন!");
                if(!user.id) return alert("❌ ইউজার আইডি পাওয়া যায়নি! টেলিগ্রাম থেকে ওপেন করুন।");

                setIsSubmitting(true);
                try {
                    const fileName = `${user.id}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                    const { error: upErr } = await supabase.storage.from('work_files').upload(fileName, file); 
                    if(upErr) throw upErr;
                    
                    const { data: { publicUrl } } = supabase.storage.from('work_files').getPublicUrl(fileName);
                    
                    const submissionData = { 
                        user_id: String(user.id), 
                        username: user.username || "No Username", 
                        service_name: service.name, 
                        file_name: file.name, 
                        file_url: publicUrl, 
                        form_data: { ...formData, sheet_content: sheetContent }
                    };
                    
                    const { error } = await supabase.from('submissions').insert([submissionData]); 
                    if(error) throw error;
                    
                    alert("✅ সফলভাবে জমা হয়েছে!");
                    onBack();
                } catch (e) { alert("Error: " + e.message); } 
                finally { setIsSubmitting(false); }
            };

            const getOpts = (cat) => options.filter(o => o.category_name === cat);

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    <div className="bg-white px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-20 border-b">
                        <button onClick={onBack} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                            <i className="fa-solid fa-arrow-left text-lg text-gray-600"></i>
                        </button>
                        <span className="font-bold text-lg text-gray-800">Infinity Submit</span>
                        <div className="w-8"></div>
                    </div>

                    <div className="p-5 space-y-6">
                        <h2 className="text-center text-xl font-bold text-blue-600">Submit {service.name}</h2>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-2">Account Type:</label>
                                <select name="Account Type" onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-3 bg-white text-sm outline-none">
                                    <option>--Select--</option>
                                    {getOpts('Account Type').map(o => <option key={o.id}>{o.option_value}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-2">Mail Type:</label>
                                <select name="Mail Type" onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-3 bg-white text-sm outline-none">
                                    <option>--Select--</option>
                                    {getOpts('Mail Type').map(o => <option key={o.id}>{o.option_value}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3">
                            <div><label className="text-xs font-bold block mb-1 text-gray-600">2FA-Cook</label><select name="2FA-Cook" onChange={handleChange} className="w-full border border-gray-300 rounded p-2 text-xs bg-white"><option>Select</option>{getOpts('2FA-Cook').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                            <div><label className="text-xs font-bold block mb-1 text-gray-600">Friends</label><select name="Friends" onChange={handleChange} className="w-full border border-gray-300 rounded p-2 text-xs bg-white"><option>Select</option>{getOpts('Friends').map(o => <option key={o.id}>{o.option_value}</option>)}</select></div>
                            <div><label className="text-xs font-bold block mb-1 text-gray-600">Total Id</label><input type="number" name="Total Id" onChange={handleChange} className="w-full border border-gray-300 rounded p-2 text-xs bg-white" placeholder="Total"/></div>
                        </div>

                        {/* 🔥 LOCKED INPUTS (TELEGRAM DATA) 🔥 */}
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-2">UserName:</label>
                                <input 
                                    type="text" 
                                    value={user.username ? "@" + user.username : "N/A"} 
                                    disabled 
                                    className="w-full border border-gray-200 rounded-lg p-3 bg-gray-100 text-gray-600 font-bold text-sm select-none"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-2">User ID:</label>
                                <input 
                                    type="text" 
                                    value={user.id || "Loading..."} 
                                    disabled 
                                    className="w-full border border-gray-200 rounded-lg p-3 bg-gray-100 text-gray-600 font-bold text-sm select-none"
                                />
                            </div>
                        </div>

                        <div>
                             <label className="block text-xs font-bold text-gray-700 mb-2">File Upload (Sheet):</label>
                            <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer bg-white hover:bg-blue-50 transition">
                                <div className="bg-green-100 text-green-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
                                    <i className="fa-solid fa-file-excel text-xl"></i>
                                </div>
                                <p className="font-bold text-gray-700 text-sm">{file ? file.name : "Click to select file"}</p>
                                <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".xlsx,.xls" />
                            </div>
                        </div>

                        <button onClick={handleSubmit} disabled={isSubmitting} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition disabled:bg-gray-400">
                            {isSubmitting ? "জমা হচ্ছে..." : "জমা দিন"}
                        </button>
                    </div>
                </div>
            );
        };

        // --- 4. History Screen ---
        const HistoryScreen = ({ user, onBack }) => {
            const [history, setHistory] = useState([]);
            
            useEffect(() => {
                const fetchHistory = async () => {
                    if(!user.id) return;
                    const { data } = await supabase.from('submissions')
                        .select('*').eq('user_id', String(user.id))
                        .order('created_at', {ascending: false}).limit(10);
                    if(data) setHistory(data);
                };
                fetchHistory();
            }, [user]);

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-white px-4 py-3 flex items-center gap-3 shadow-sm sticky top-0 border-b">
                        <button onClick={onBack}><i className="fa-solid fa-arrow-left text-xl text-gray-600"></i></button>
                        <span className="font-bold text-lg text-gray-800">History</span>
                    </div>
                    <div className="p-4 space-y-3">
                        {history.length === 0 ? 
                            <div className="flex flex-col items-center mt-10 text-gray-400">
                                <i className="fa-regular fa-folder-open text-4xl mb-2"></i>
                                <p>No history.</p>
                            </div> 
                            : 
                            history.map(h => (
                                <div key={h.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-gray-800">{h.service_name}</p>
                                        <p className="text-xs text-gray-400">{new Date(h.created_at).toDateString()}</p>
                                    </div>
                                    <span className={`text-xs px-3 py-1 rounded-full font-medium ${h.status==='Approved'?'bg-green-100 text-green-600': (h.status==='Rejected'?'bg-red-100 text-red-600':'bg-yellow-100 text-yellow-600')}`}>
                                        {h.status || 'Pending'}
                                    </span>
                                </div>
                            ))
                        }
                    </div>
                </div>
            );
        };

        // --- 5. Main App Logic (Fixed User Loading Loop) ---
        const App = () => {
            const [screen, setScreen] = useState("loading");
            // Default "Waiting..." state
            const [user, setUser] = useState({ id: "", first_name: "Guest", last_name: "", username: "", photo_url: null });
            const [services, setServices] = useState([]);
            const [appSettings, setAppSettings] = useState(null);
            const [selectedService, setSelectedService] = useState(null);

            useEffect(() => {
                // ✅ FORCE CHECK TELEGRAM DATA
                const checkTelegramData = () => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const tg = window.Telegram.WebApp;
                        tg.expand();
                        tg.ready();

                        const tgUser = tg.initDataUnsafe?.user;
                        if (tgUser && tgUser.id) {
                            console.log("Found User:", tgUser);
                            setUser({
                                id: tgUser.id,
                                first_name: tgUser.first_name || "Unknown",
                                last_name: tgUser.last_name || "",
                                username: tgUser.username || "",
                                photo_url: tgUser.photo_url || null // Photo capture
                            });
                            return true; // Found
                        }
                    }
                    return false; // Not found yet
                };

                // Try immediately
                if (!checkTelegramData()) {
                    // If not found, try every 100ms for 2 seconds (Mini App fix)
                    const interval = setInterval(() => {
                        if (checkTelegramData()) {
                            clearInterval(interval);
                        }
                    }, 100);
                    setTimeout(() => clearInterval(interval), 2000);
                }

                // Fetch Supabase Data
                const fetchData = async () => {
                    const [svc, set] = await Promise.all([
                        supabase.from('services').select('*').order('id'),
                        supabase.from('settings').select('*').single()
                    ]);
                    if(svc.data) setServices(svc.data);
                    if(set.data) setAppSettings(set.data);
                    
                    setTimeout(() => setScreen("dashboard"), 1200);
                };
                fetchData();

            }, []);

            return (
                <>
                    {screen === "loading" && <LoadingScreen />}
                    {screen === "dashboard" && (
                        <Dashboard 
                            user={user} 
                            services={services} 
                            appSettings={appSettings} 
                            onServiceClick={(s) => { setSelectedService(s); setScreen("form"); }}
                            onHistoryClick={() => setScreen("history")}
                        />
                    )}
                    {screen === "form" && <FormScreen service={selectedService} user={user} onBack={() => setScreen("dashboard")} />}
                    {screen === "history" && <HistoryScreen user={user} onBack={() => setScreen("dashboard")} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
  </html>
